[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phoebe-cleaner"
version = "0.3.0"
description = "An animated Windows recycle-bin companion"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "pywinauto>=0.6.9,<1",
    "send2trash>=1.8,<2",
]

[project.scripts]
phoebe-cleaner = "phoebe_cleaner.app:main"

[project.optional-dependencies]
animation = [
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
]

[tool.setuptools]
package-dir = {"" = "python_app"}

[tool.setuptools.packages.find]
where = ["python_app"]
